model_list:

  - model_name: gpt120
    litellm_params:
      model: openrouter/openai/gpt-oss-120b

  - model_name: mini
    litellm_params:
      model: openai/gpt-5.4-mini

  - model_name: opus5
    litellm_params:
      model: openai/claude-opus-5
      api_base: http://10.50.0.11:8081/v1

  - model_name: haiku
    litellm_params:
      model: openai/claude-haiku-4.5
      api_base: http://10.50.0.11:8081/v1

  - model_name: gemini
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: http://10.50.0.11:8081/v1

  - model_name: qwen
    litellm_params:
      model: groq/qwen/qwen3.8-27b

  - model_name: deep
    litellm_params:
      model: deepseek/deepseek-chat

  - model_name: gpt3
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://10.50.0.11:8081/v1

  - model_name: cohe
    litellm_params:
      model: cohere/command-a-03-2025

  - model_name: ngrok
    litellm_params:
      model: openai/ngrok/auto
      api_base: https://gateway.ngrok.ai
    model_info:
      input_cost_per_token: 0.0000010    # $1.00 per M, placeholder
      output_cost_per_token: 0.0000050   # $5.00 per M, placeholder


router_settings:
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: simple-shuffle
  fallbacks:
    - "*": ["mini"]
  # routing_strategy: least-busy
  # routing_strategy: usage-based-routing
  # routing_strategy: usage-based-routing-v2
  # routing_strategy: latency-based-routing
  # routing_strategy: cost-based-routing

